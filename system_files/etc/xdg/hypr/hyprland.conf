# Default Hyprland configuration for my-hypr-bizzite.
# GNOME remains available as a separate login session.

$mainMod = SUPER

monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
}

animations {
    enabled = yes
}

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# Start the panel, network indicator and graphical polkit agent.
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = lxpolkit

# Applications
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, flatpak run --system com.brave.Browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu

# Window and session controls
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating

# Move focus with Super + arrow keys.
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Audio and brightness keys.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot: select a region and copy it to the clipboard.
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy

# NVIDIA hybrid graphics:
# Do not force the whole session onto the NVIDIA dGPU. The base Bazzite
# NVIDIA image retains control of its driver and PRIME configuration.
